<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KORRE</title>
<meta name="theme-color" content="#080A08">
<meta name="description" content="KORRE: corrida e caminhada com ranking, feita para Angola.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KORRE">
<style>
:root{--bg:#080A08;--card:#111511;--neon:#39FF69;--green:#19C75A;--text:#F5F7F5;--muted:#A0AAA2;--line:#252D27;--amber:#FFB938;--red:#FF5A5F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.35;overflow-x:hidden;overscroll-behavior-y:none}
#view{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#view.notabs{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
h1{font-size:30px;font-weight:900;line-height:1.1;letter-spacing:-.5px}h2{font-size:22px;font-weight:900;margin-bottom:10px}h3{font-size:16px;font-weight:800;margin-bottom:6px}
.muted{color:var(--muted)}.small{font-size:13px}.neon{color:var(--neon)}.center{text-align:center}
.logo{mix-blend-mode:screen;display:block;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.who{display:flex;align-items:center;gap:10px;min-width:0}.who b{font-size:18px;overflow-wrap:anywhere}
.iconbtn{position:relative;width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;flex:none}
.dotbadge{position:absolute;top:5px;right:5px;min-width:18px;height:18px;border-radius:9px;background:var(--neon);color:#000;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 4px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:16px;border:0;font-size:16px;font-weight:900;padding:0 16px;letter-spacing:.3px;color:var(--text)}
.btn-neon{background:var(--neon);color:#031006;box-shadow:0 0 22px rgba(57,255,105,.25)}.btn-xl{min-height:72px;font-size:20px;border-radius:22px}
.btn-ghost{background:transparent;border:2px solid #34403a}.btn-danger{background:transparent;color:var(--red);border:2px solid var(--red)}.btn-dark{background:#1d231f}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.5}
.btn-link{background:none;border:0;color:var(--neon);font-weight:800;font-size:15px;min-height:44px;padding:0 4px;text-decoration:underline}
.metric{background:var(--card);border-radius:16px;padding:12px 8px;text-align:center;border:1px solid var(--line)}.metric b{display:block;white-space:nowrap;font-size:21px;font-weight:900;font-variant-numeric:tabular-nums}.metric span{font-size:12px;color:var(--muted)}
.big{font-size:62px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}.big small{font-size:20px;font-weight:700;color:var(--muted);margin-left:4px}
.bar{height:12px;border-radius:6px;background:#1f2621;overflow:hidden;margin:8px 0 6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--neon));border-radius:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;background:var(--card);color:var(--text);border:1px solid var(--line);font-weight:700;font-size:14px}.chip.on{background:var(--neon);color:#031006;border-color:var(--neon)}
label.f{display:block;font-weight:800;font-size:14px;margin:12px 0 6px}
select,input[type=text],input[type=email],input[type=password],input[type=number]{width:100%;height:50px;border-radius:14px;border:2px solid #2f3a33;background:#0c100d;color:var(--text);font-size:16px;padding:0 14px;-webkit-appearance:none;appearance:none}
input:focus,select:focus{outline:3px solid rgba(57,255,105,.4);border-color:var(--neon)}
.ferr{color:var(--red);font-size:13px;font-weight:700;margin-top:4px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:12px 0}.chk input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:#39FF69}
.act{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;color:var(--text)}
.act .mi{flex:none;width:44px;height:44px;border-radius:12px;background:#0c100d;display:flex;align-items:center;justify-content:center;color:var(--neon)}.act .t{min-width:0;flex:1}.act b{font-size:18px}
.tag{display:inline-block;font-size:11px;font-weight:900;padding:3px 9px;border-radius:999px;margin:2px 4px 2px 0;letter-spacing:.3px}
.tag.ok{background:rgba(57,255,105,.14);color:var(--neon)}.tag.rev{background:rgba(255,185,56,.15);color:var(--amber)}.tag.rej{background:rgba(255,90,95,.15);color:var(--red)}.tag.demo{background:#F5F7F5;color:#000}
.mode{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;color:var(--text)}.mode.on{border-color:var(--neon);box-shadow:0 0 18px rgba(57,255,105,.2)}
.mode .mi{flex:none;width:56px;height:56px;border-radius:16px;background:#0c100d;display:flex;align-items:center;justify-content:center;color:var(--neon)}
.map{height:250px;border-radius:18px;overflow:hidden;margin-bottom:8px;background:#0c100d;border:1px solid var(--line)}.nomap{display:flex;height:100%;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--muted);font-size:14px}
.leaflet-container{background:#0c100d;font-family:inherit}.pin{width:16px;height:16px;border-radius:50%;border:3px solid #000}
#tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(8,10,8,.96);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#tabs button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;font-size:11px;font-weight:700}#tabs button.on{color:var(--neon)}
#demo-strip{background:#F5F7F5;color:#000;font-weight:900;font-size:13px;padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 6px;text-align:center}
#banner{background:#2a1d00;color:var(--amber);padding:10px 14px;font-size:14px;font-weight:700;text-align:center}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#0f130f;width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
.notif{padding:12px 0;border-bottom:1px solid var(--line)}.notif.unread b{color:var(--neon)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:92vw;background:#F5F7F5;color:#000;padding:12px 16px;border-radius:14px;font-weight:800;font-size:15px;z-index:60}#toast.err{background:var(--red);color:#fff}
.rank{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}.rank .pos{width:44px;font-weight:900;font-variant-numeric:tabular-nums}.rank .nm{flex:1;min-width:0;overflow-wrap:anywhere}.rank.me{background:rgba(57,255,105,.1);border-radius:12px;border-bottom-color:transparent}.rank .km{font-weight:900;font-variant-numeric:tabular-nums}
.avatar{width:72px;height:72px;border-radius:50%;color:#031006;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.rules li{margin:0 0 8px 18px;font-size:14px;color:#d4dad6}.chart text{fill:#A0AAA2;font-size:10px}.chart .v{fill:#F5F7F5;font-weight:700}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}.switch button{width:58px;height:32px;border-radius:16px;border:0;background:#2a332d;position:relative;flex:none}.switch button::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}.switch button.on{background:var(--neon)}.switch button.on::after{left:29px;background:#031006}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.splash{min-height:82vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
@media (max-width:350px){.big{font-size:50px}h1{font-size:25px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="banner" role="status" hidden></div>
<main id="view"></main>
<nav id="tabs" aria-label="Navegação principal" hidden></nav>
<div id="sheet" class="sheet-bg" hidden><div class="sheet" role="dialog" aria-modal="true" aria-label="Notificações"><div id="sheet-body"></div><button type="button" class="btn btn-dark" data-action="close-sheet" style="margin-top:12px">Fechar</button></div></div>
<div id="modal" class="sheet-bg" hidden><div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="m-title"><h2 id="m-title"></h2><p id="m-text" class="muted" style="margin-bottom:16px"></p><button type="button" id="m-ok" class="btn btn-danger"></button><button type="button" id="m-cancel" class="btn btn-dark" style="margin-top:10px">Cancelar</button></div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

async function clearLocalUser(uid) {
  try { await Store.delUser(uid); } catch (e) {}
  ['korre_notifs_', 'korre_flags_', 'korre_pos_', 'korre_prefs_'].forEach(function (k) { lsDel(k + uid); });
  Auth.clear(); state.user = null; state.acts = []; state.notifs = []; state.myPos = null; state.run = newRun(); state.draft = null;
}
async function onAction(act, el) {
  var u = state.user;
  switch (act) {
    case 'nav': go(el.getAttribute('data-view')); break;
    case 'pick-mode': state.choice.mode = el.getAttribute('data-m'); render(); break;
    case 'confirm-start': startRun(); break;
    case 'pause': pauseRun(); break; case 'resume': resumeRun(); break; case 'finish': finishRun(); break; case 'save': saveRun(); break; case 'discard': discardRun(); break;
    case 'filter': state.hist.mode = el.getAttribute('data-v'); render(); break;
    case 'open-act': go('detail', { id: el.getAttribute('data-id') }); break;
    case 'sync-now': if (!navigator.onLine) { toast('Sem ligação à internet.', true); break; } toast('A sincronizar…'); await pullActivities(); await syncPending(); break;
    case 'rank-tab': state.rankTab = el.getAttribute('data-t'); render(); break;
    case 'rank-refresh': loadRanking(); break;
    case 'join-ranking': try { await patchProfile({ show_in_ranking: true }); await refreshPosition(false); toast('Já estás no ranking.'); render(); } catch (e) { toast(apiMessage(e), true); } break;
    case 'toggle-ranking': try { await patchProfile({ show_in_ranking: !u.showInRanking }); toast(state.user.showInRanking ? 'Já estás no ranking.' : 'Saíste do ranking.'); render(); } catch (e) { toast(apiMessage(e), true); } break;
    case 'set-goal':
      var m = el.getAttribute('data-m'), g = Math.round(+$('g-' + m).value);
      if (!(g >= 1 && g <= 1000)) { toast('Introduz uma meta entre 1 e 1000 km.', true); break; }
      try { var f = {}; f[m + '_goal_km'] = g; await patchProfile(f); runGoalNotifs(); toast('Meta de ' + MODES[m].toLowerCase() + ': ' + g + ' km'); render(); } catch (e) { toast(apiMessage(e), true); } break;
    case 'avatar': try { await patchProfile({ avatar_color: el.getAttribute('data-c') }); render(); } catch (e) { toast(apiMessage(e), true); } break;
    case 'toggle-motiv': u.prefs.motivational = !u.prefs.motivational; lsSet('korre_prefs_' + u.id, u.prefs); render(); break;
    case 'bell': openBell(); render(); break;
    case 'close-sheet': $('sheet').hidden = true; render(); break;
    case 'feedback': sendFeedback(); break;
    case 'share': go('share', { id: el.getAttribute('data-id'), draft: el.getAttribute('data-draft') === '1' }); break;
    case 'share-back': if (state.params.draft) go('active'); else go('detail', { id: state.params.id }); break;
    case 'share-fmt': state.share.fmt = el.getAttribute('data-f'); render(); break;
    case 'share-bg': if (el.getAttribute('data-b') === 'photo') $('share-file').click(); else { state.share.bg = 'dark'; render(); } break;
    case 'share-trim': state.share.trim = !state.share.trim; render(); break;
    case 'share-do': doShare(); break;
    case 'share-save': withShareBlob(saveBlob); break;
    case 'logout':
      if (state.run.status !== 'idle') { toast('Termina a actividade em curso primeiro.', true); break; }
      await syncPending();
      var left = state.acts.filter(function (a) { return !a.synced && !a.localOnly; }).length;
      if (left && !(await askConfirm('Sair mesmo assim?', 'Tens ' + left + ' actividade(s) por enviar que serão perdidas se saíres agora.', 'Sair e perder'))) break;
      await clearLocalUser(u.id); go('welcome'); break;
    case 'delete-account':
      if (state.run.status !== 'idle') { toast('Termina a actividade em curso primeiro.', true); break; }
      if (!(await askConfirm('Apagar conta e dados?', 'A tua conta, o perfil e todas as actividades serão apagados de forma definitiva. Não é possível desfazer.', 'Apagar tudo'))) break;
      try { await api('/rest/v1/rpc/delete_my_account', { method: 'POST', body: {} }); await clearLocalUser(u.id); toast('Conta e dados apagados.'); go('welcome'); } catch (e) { toast(apiMessage(e), true); } break;
  }
}

  }
});
document.addEventListener('change', function (e) { if (e.target.id === 'rank-prov') { state.rankProv = e.target.value; render(); } if (e.target.id === 'share-file') loadSharePhoto(e.target.files && e.target.files[0]); });
document.addEventListener('visibilitychange', function () { var r = state.run; if (document.visibilityState === 'visible' && r.status === 'running') { requestWake(); toast('A app esteve em segundo plano: pode haver lacunas no percurso.'); } });
window.addEventListener('unhandledrejection', function (e) { if (e.preventDefault) e.preventDefault(); toast('Ocorreu um erro inesperado. Tenta novamente.', true); });

/* ============================================================
   6. INICIALIZAÇÃO
   ============================================================ */
async function init() {
  ['icon', 'apple-touch-icon'].forEach(function (rel) { var l = document.createElement('link'); l.rel = rel; l.href = LOGO; if (rel === 'icon') l.type = 'image/png'; document.head.appendChild(l); });
  var m = document.createElement('link'); m.rel = 'manifest';
  m.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify({ name: 'KORRE', short_name: 'KORRE', start_url: location.origin + location.pathname, display: 'standalone', background_color: '#080A08', theme_color: '#080A08', icons: [{ src: LOGO, sizes: '256x256', type: 'image/png' }] })); document.head.appendChild(m);
  $('tabs').innerHTML = [['home', 'Início', 'home'], ['runs', 'Corridas', 'runs'], ['ranking', 'Ranking', 'rank'], ['profile', 'Perfil', 'profile']].map(function (t) { return '<button type="button" data-action="nav" data-view="' + t[0] + '" data-tab="' + t[0] + '" aria-label="' + t[1] + '">' + icon(t[2]) + '<span>' + t[1] + '</span></button>'; }).join('');
  state.logoImg = new Image(); state.logoImg.src = LOGO;
  go('splash'); var sp = splashDone;
  document.addEventListener('click', function () { if (state.view === 'splash' && splashSkip) splashSkip(); });
  state.dbOk = await Store.open();
  if (!state.dbOk) { $('banner').textContent = 'O armazenamento do navegador não está disponível (modo privado?). As actividades por enviar perdem-se se fechares a página.'; $('banner').hidden = false; }
  // ligações vindas do e-mail (confirmação de conta ou recuperação de palavra-passe)
  var hash = location.hash.replace(/^#/, ''), hp = {}; hash.split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) hp[p[0]] = decodeURIComponent(p[1] || ''); });
  var fromEmail = !!hp.access_token; if (fromEmail) { var uid = null; try { uid = JSON.parse(atob(hp.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).sub; } catch (e) {} Auth.set({ access_token: hp.access_token, refresh_token: hp.refresh_token, expires_in: hp.expires_in }, uid); history.replaceState(null, '', location.pathname + location.search); }
  var next = 'welcome';
  if (configured() && Auth.get()) {
    try { await startSession(Auth.get().user_id); next = fromEmail && hp.type === 'recovery' ? 'newpass' : 'home'; }
    catch (e) { if (e.offline && Auth.get()) { next = 'offline'; } else { Auth.clear(); } }
  }
  await sp;
  if (next === 'offline') { $('view').innerHTML = '<div class="splash" style="min-height:60vh">' + logoImg(110) + '<h2>Sem ligação</h2><p class="muted">Não foi possível abrir a tua conta. Verifica a ligação e tenta novamente.</p><button type="button" class="btn btn-neon" onclick="location.reload()">TENTAR NOVAMENTE</button></div>'; return; }
  go(next); if (next === 'home') { pullActivities().then(function () { return syncPending(); }); }
  setTimeout(function () { loadLeaflet(); }, 2500);
}
init();
})();
</script>
