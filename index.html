<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KORRE</title>
<meta name="theme-color" content="#2A2D2B">
<meta name="description" content="KORRE: corrida e caminhada com ranking, feita para Angola.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KORRE">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--on:#1F2321;--bg:#2A2D2B;--s1:#333735;--s2:#3B403D;--line:#474D49;--text:#F3F5F3;--muted:#AEB5B0;--neon:#34B36B;--green:#2E9E5F;--amber:#FFB938;--red:#FF8A8E;
 --fh:"Barlow Condensed","Avenir Next Condensed","HelveticaNeue-CondensedBold","Arial Narrow","DejaVu Sans Condensed",sans-serif;
 --fb:"Barlow",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px;line-height:1.45;overflow-x:hidden;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
#view{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(20px,env(safe-area-inset-right,0px)) calc(104px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
#view.notabs{padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--fh);font-size:40px;font-weight:700;line-height:1;letter-spacing:.01em;text-transform:uppercase}
h2{font-family:var(--fh);font-size:26px;font-weight:700;line-height:1.05;letter-spacing:.02em;text-transform:uppercase;margin-bottom:10px}
h3{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.muted{color:var(--muted)}.small{font-size:13px}.neon{color:var(--neon)}.center{text-align:center}
.sect{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 6px}
.logo{display:block;flex:none}
.wordmark{font-family:var(--fh);font-size:24px;font-weight:700;letter-spacing:.22em;text-indent:.1em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.who{display:flex;align-items:center;gap:10px;min-width:0}
.iconbtn{position:relative;width:44px;height:44px;border-radius:50%;background:transparent;border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;flex:none}
.dotbadge{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--neon);color:#1F2321;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:6px;border:0;font-family:var(--fh);font-size:20px;font-weight:600;letter-spacing:.03em;text-transform:none;padding:0 18px;color:var(--text)}
.btn-primary{background:var(--neon);color:var(--on)}.btn-xl{min-height:62px;font-size:24px}
.btn-ghost{background:transparent;border:0;border-top:1px solid var(--text);border-bottom:1px solid var(--line);border-radius:0;justify-content:space-between;padding:0 2px;min-height:58px}
.btn-ghost::after{content:"\2192";font-family:var(--fb);font-weight:400;font-size:20px;color:var(--muted)}
.btn-dark{background:transparent;border:1px solid #5A615C;color:var(--text)}
.btn-danger{background:transparent;color:#FF8A8E;border:1px solid rgba(255,138,142,.55)}
.btn:active{opacity:.85}.btn[disabled]{opacity:.5}
.btn-link{background:none;border:0;color:var(--neon);font-family:var(--fb);font-weight:600;font-size:14px;min-height:44px;padding:0 2px}
.metric{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;text-align:left}
.metric b{display:block;font-family:var(--fh);font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.metric span{display:block;line-height:1.25;margin-top:2px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:20px 0 20px}
.stats .metric{flex:1;min-width:0;background:none;border:0;border-left:1px solid var(--line);border-radius:0;padding:14px 4px 12px 14px}.stats .metric:first-child{border-left:0;padding-left:0}
.big{font-family:var(--fh);font-weight:700;font-size:96px;line-height:.9;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.big small{font-family:var(--fb);font-size:16px;font-weight:600;color:var(--muted);margin-left:8px;letter-spacing:.04em}
.bar{height:6px;border-radius:3px;background:#40463F;overflow:hidden;margin:8px 0 6px}.bar i{display:block;height:100%;background:var(--neon);border-radius:3px;transition:width .4s}
.goal{margin:14px 0}.gl{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}.gl b{font-family:var(--fh);font-size:22px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}.chip{flex:none;min-height:40px;padding:0 13px;border-radius:999px;background:transparent;color:var(--text);border:1px solid #4A514C;font-weight:600;font-size:13px}.chip.on{background:var(--neon);color:#1F2321;border-color:var(--neon)}
label.f{display:block;font-weight:600;font-size:13px;letter-spacing:.02em;margin:14px 0 6px;color:#d3d9d5}
select,input[type=text],input[type=email],input[type=password],input[type=number]{width:100%;height:50px;border-radius:12px;border:1px solid #4A514C;background:var(--s1);color:var(--text);font-family:var(--fb);font-size:16px;padding:0 14px;-webkit-appearance:none;appearance:none}
input:focus,select:focus{outline:2px solid rgba(52,179,107,.35);border-color:var(--neon)}
.ferr{color:var(--red);font-size:13px;font-weight:600;margin-top:4px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:14px 0}.chk input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:#34B36B}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);font-family:var(--fb);font-size:16px;text-align:left;padding:8px 2px}
.li .small{line-height:1.3}.li .chev{color:var(--muted);font-size:22px;line-height:1}.li.danger{color:var(--red)}
.act{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 2px;margin:0;color:var(--text)}
.act .mi{flex:none;width:42px;height:42px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--neon)}.act .t{min-width:0;flex:1}.act b{font-family:var(--fh);font-size:26px;font-weight:700;letter-spacing:.01em}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;margin:3px 5px 0 0;letter-spacing:.09em}
.tag.ok{background:rgba(52,179,107,.12);color:var(--neon)}.tag.rev{background:rgba(255,185,56,.14);color:var(--amber)}.tag.rej{background:rgba(255,90,95,.14);color:var(--red)}.tag.demo{background:#F3F5F3;color:#000}
.mode{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--s1);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;color:var(--text)}.mode.on{border-color:var(--neon)}
.mode .mi{flex:none;width:54px;height:54px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--neon)}
.mode b{font-family:var(--fh);font-size:26px;letter-spacing:.05em}
.map{height:250px;border-radius:14px;overflow:hidden;margin-bottom:8px;background:#262927;border:1px solid var(--line)}.nomap{display:flex;height:100%;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--muted);font-size:14px}
.leaflet-container{background:#262927;font-family:inherit}.pin{width:16px;height:16px;border-radius:50%;border:3px solid #2A2D2B}
#tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(42,45,43,.96);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#tabs button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;font-family:var(--fb);font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}#tabs button.on{color:var(--neon)}
#banner{background:#241a08;color:var(--amber);padding:10px 14px;font-size:13px;font-weight:600;text-align:center}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#303431;width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
.notif{padding:12px 0;border-bottom:1px solid var(--line)}.notif.unread b{color:var(--neon)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:max-content;max-width:90vw;background:var(--s2);color:var(--text);padding:12px 16px;border-radius:10px;border:1px solid var(--line);border-left:3px solid var(--neon);font-weight:500;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.5)}#toast.err{border-left-color:var(--red)}
.rank{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}.rank .pos{width:46px;font-family:var(--fh);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.rank .nm{flex:1;min-width:0;overflow-wrap:anywhere}.rank.me{background:rgba(52,179,107,.08);border-radius:10px;border-bottom-color:transparent}.rank .km{font-family:var(--fh);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.avatar{width:64px;height:64px;border-radius:50%;color:#1F2321;font-family:var(--fh);font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.rules li{margin:0 0 8px 18px;font-size:14px;color:#d4dad6}.chart text{fill:#AEB5B0;font-size:10px}.chart .v{fill:#F3F5F3;font-weight:600}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}.switch button{width:52px;height:30px;border-radius:15px;border:0;background:#4A514C;position:relative;flex:none}.switch button::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}.switch button.on{background:var(--neon)}.switch button.on::after{left:25px;background:#1F2321}
.splash{min-height:82vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.splash h1{letter-spacing:.3em;text-indent:.15em;font-size:44px}
@media (max-width:350px){.big{font-size:76px}h1{font-size:32px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="banner" role="status" hidden></div>
<main id="view"></main>
<nav id="tabs" aria-label="Navegação principal" hidden></nav>
<div id="sheet" class="sheet-bg" hidden><div class="sheet" role="dialog" aria-modal="true" aria-label="Notificações"><div id="sheet-body"></div><button type="button" class="btn btn-dark" data-action="close-sheet" style="margin-top:12px">Fechar</button></div></div>
<div id="modal" class="sheet-bg" hidden><div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="m-title"><h2 id="m-title"></h2><p id="m-text" class="muted" style="margin-bottom:16px"></p><button type="button" id="m-ok" class="btn btn-danger"></button><button type="button" id="m-cancel" class="btn btn-dark" style="margin-top:10px">Cancelar</button></div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

function trimRoute(coords, maxM, frac) {

}
function saveBlob(blob, name) {
  var url = URL.createObjectURL(blob), l = document.createElement('a'); l.href = url; l.download = name; document.body.appendChild(l); l.click(); l.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 5000); toast('Imagem guardada.');
}
function withShareBlob(fn) {
  var S = state.share, a = shareActivity(); if (!a) return;
  var name = 'korre-' + (a.mode === 'run' ? 'corrida' : 'caminhada') + '.png';
  if (S.blob) return fn(S.blob, name);
  var cv = $('share-canvas'); if (!cv) return; cv.toBlob(function (b) { S.blob = b; if (b) fn(b, name); else toast('Não foi possível criar a imagem.', true); }, 'image/png');
}
function doShare() {
  withShareBlob(function (blob, name) {
    var file; try { file = new File([blob], name, { type: 'image/png' }); } catch (e) { saveBlob(blob, name); return; }
    if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], text: 'A minha actividade na KORRE' }).catch(function (e) { if (!e || e.name !== 'AbortError') saveBlob(blob, name); }); }
    else saveBlob(blob, name);
  });
}
function loadSharePhoto(file) {
  if (!file) return; var url = URL.createObjectURL(file), img = new Image();
  img.onload = function () { state.share.photo = img; state.share.bg = 'photo'; render(); };
  img.onerror = function () { toast('Não foi possível abrir essa foto.', true); }; img.src = url;
}

/* ============================================================
   5. AÇÕES
   ============================================================ */
async function clearLocalUser(uid) {
  try { await Store.delUser(uid); } catch (e) {}
  ['korre_notifs_', 'korre_flags_', 'korre_pos_', 'korre_prefs_'].forEach(function (k) { lsDel(k + uid); });
  Auth.clear(); state.user = null; state.acts = []; state.notifs = []; state.myPos = null; state.run = newRun(); state.draft = null;
}
async function onAction(act, el) {
  var u = state.user;
  switch (act) {
    case 'nav': go(el.getAttribute('data-view')); break;
    case 'pick-mode': state.choice.mode = el.getAttribute('data-m'); render(); break;
    case 'confirm-start': startRun(); break;
    case 'pause': pauseRun(); break; case 'resume': resumeRun(); break; case 'finish': finishRun(); break; case 'save': saveRun(); break; case 'discard': discardRun(); break;
    case 'filter': state.hist.mode = el.getAttribute('data-v'); render(); break;
    case 'open-act': go('detail', { id: el.getAttribute('data-id') }); break;
    case 'sync-now': if (!navigator.onLine) { toast('Sem ligação à internet.', true); break; } toast('A sincronizar…'); await pullActivities(); await syncPending(); break;
    case 'rank-tab': state.rankTab = el.getAttribute('data-t'); render(); break;
    case 'rank-refresh': loadRanking(); break;
    case 'join-ranking': try { await patchProfile({ show_in_ranking: true }); await refreshPosition(false); toast('Já estás no ranking.'); render(); } catch (e) { toast(apiMessage(e), true); } break;
    case 'toggle-ranking': try { await patchProfile({ show_in_ranking: !u.showInRanking }); toast(state.user.showInRanking ? 'Já estás no ranking.' : 'Saíste do ranking.'); render(); } catch (e) { toast(apiMessage(e), true); } break;
    case 'set-goal':
      var m = el.getAttribute('data-m'), g = Math.round(+$('g-' + m).value);
      if (!(g >= 1 && g <= 1000)) { toast('Introduz uma meta entre 1 e 1000 km.', true); break; }
      try { var f = {}; f[m + '_goal_km'] = g; await patchProfile(f); runGoalNotifs(); toast('Meta de ' + MODES[m].toLowerCase() + ': ' + g + ' km'); render(); } catch (e) { toast(apiMessage(e), true); } break;
    case 'avatar': try { await patchProfile({ avatar_color: el.getAttribute('data-c') }); render(); } catch (e) { toast(apiMessage(e), true); } break;
    case 'toggle-motiv': u.prefs.motivational = !u.prefs.motivational; lsSet('korre_prefs_' + u.id, u.prefs); render(); break;
    case 'bell': openBell(); render(); break;
    case 'close-sheet': $('sheet').hidden = true; render(); break;
    case 'feedback': sendFeedback(); break;
    case 'share': go('share', { id: el.getAttribute('data-id'), draft: el.getAttribute('data-draft') === '1' }); break;
    case 'share-back': if (state.params.draft) go('active'); else go('detail', { id: state.params.id }); break;
    case 'share-fmt': state.share.fmt = el.getAttribute('data-f'); render(); break;
    case 'share-bg': if (el.getAttribute('data-b') === 'photo') $('share-file').click(); else { state.share.bg = 'dark'; render(); } break;
    case 'share-trim': state.share.trim = !state.share.trim; render(); break;
    case 'share-do': doShare(); break;
    case 'share-save': withShareBlob(saveBlob); break;
    case 'logout':
      if (state.run.status !== 'idle') { toast('Termina a actividade em curso primeiro.', true); break; }
      await syncPending();
      var left = state.acts.filter(function (a) { return !a.synced && !a.localOnly; }).length;
      if (left && !(await askConfirm('Sair mesmo assim?', 'Tens ' + left + ' actividade(s) por enviar que serão perdidas se saíres agora.', 'Sair e perder'))) break;
      await clearLocalUser(u.id); go('welcome'); break;
    case 'delete-account':
      if (state.run.status !== 'idle') { toast('Termina a actividade em curso primeiro.', true); break; }
      if (!(await askConfirm('Apagar conta e dados?', 'A tua conta, o perfil e todas as actividades serão apagados de forma definitiva. Não é possível desfazer.', 'Apagar tudo'))) break;
      try { await api('/rest/v1/rpc/delete_my_account', { method: 'POST', body: {} }); await clearLocalUser(u.id); toast('Conta e dados apagados.'); go('welcome'); } catch (e) { toast(apiMessage(e), true); } break;
  }
}
document.addEventListener('click', function (e) { var el = e.target.closest ? e.target.closest('[data-action]') : null; if (el) onAction(el.getAttribute('data-action'), el).catch(function (x) { toast(x && x.isApi ? apiMessage(x) : 'Ocorreu um erro inesperado. Tenta novamente.', true); }); });
document.addEventListener('submit', function (e) {
  e.preventDefault(); var id = e.target.id;
  if (id === 'f-reg') onRegister(); else if (id === 'f-login') onLogin(); else if (id === 'f-rec') onRecover(); else if (id === 'f-newpass') onNewPass();
  else if (id === 'f-edit') {
    var name = $('p-name').value.trim(), rn = $('p-rname').value.trim(); fieldErr('e-pname', ''); fieldErr('e-prname', '');
    if (name.length < 2) { fieldErr('e-pname', 'Introduz o teu nome.'); return; } if (rn && (rn.length < 2 || rn.length > 30)) { fieldErr('e-prname', 'Entre 2 e 30 caracteres.'); return; }
    busyBtn('p-go', true);
    patchProfile({ display_name: name, ranking_name: rn || null, province: $('p-prov').value, sex: $('p-sex').value, sex_public: !$('p-priv').checked }).then(function () { toast('Perfil actualizado.'); go('profile'); }, function (x) { toast(apiMessage(x), true); busyBtn('p-go', false, 'GUARDAR'); });
  }
});
document.addEventListener('change', function (e) { if (e.target.id === 'rank-prov') { state.rankProv = e.target.value; render(); } if (e.target.id === 'share-file') loadSharePhoto(e.target.files && e.target.files[0]); });
document.addEventListener('visibilitychange', function () { var r = state.run; if (document.visibilityState === 'visible' && r.status === 'running') { requestWake(); toast('A app esteve em segundo plano: pode haver lacunas no percurso.'); } });
window.addEventListener('unhandledrejection', function (e) { if (e.preventDefault) e.preventDefault(); toast('Ocorreu um erro inesperado. Tenta novamente.', true); });

/* ============================================================
   6. INICIALIZAÇÃO
   ============================================================ */
async function init() {
  ['icon', 'apple-touch-icon'].forEach(function (rel) { var l = document.createElement('link'); l.rel = rel; l.href = ICON_PNG; l.type = 'image/png'; document.head.appendChild(l); });
  var m = document.createElement('link'); m.rel = 'manifest';
  m.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify({ name: 'KORRE', short_name: 'KORRE', start_url: location.origin + location.pathname, display: 'standalone', background_color: '#2A2D2B', theme_color: '#2A2D2B', icons: [{ src: ICON_PNG, sizes: '512x512', type: 'image/png' }] })); document.head.appendChild(m);
  $('tabs').innerHTML = [['home', 'Início', 'home'], ['runs', 'Corridas', 'runs'], ['ranking', 'Ranking', 'rank'], ['profile', 'Perfil', 'profile']].map(function (t) { return '<button type="button" data-action="nav" data-view="' + t[0] + '" data-tab="' + t[0] + '" aria-label="' + t[1] + '">' + icon(t[2]) + '<span>' + t[1] + '</span></button>'; }).join('');
  state.logoImg = new Image(); state.logoImg.src = LOGO;
  go('splash'); var sp = splashDone;
  document.addEventListener('click', function () { if (state.view === 'splash' && splashSkip) splashSkip(); });
  state.dbOk = await Store.open();
  if (!state.dbOk) { $('banner').textContent = 'O armazenamento do navegador não está disponível (modo privado?). As actividades por enviar perdem-se se fechares a página.'; $('banner').hidden = false; }
  // ligações vindas do e-mail (confirmação de conta ou recuperação de palavra-passe)
  var hash = location.hash.replace(/^#/, ''), hp = {}; hash.split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) hp[p[0]] = decodeURIComponent(p[1] || ''); });
  var fromEmail = !!hp.access_token; if (fromEmail) { var uid = null; try { uid = JSON.parse(atob(hp.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).sub; } catch (e) {} Auth.set({ access_token: hp.access_token, refresh_token: hp.refresh_token, expires_in: hp.expires_in }, uid); history.replaceState(null, '', location.pathname + location.search); }
  var next = 'welcome';
  if (configured() && Auth.get()) {
    try { await startSession(Auth.get().user_id); next = fromEmail && hp.type === 'recovery' ? 'newpass' : 'home'; }
    catch (e) { if (e.offline && Auth.get()) { next = 'offline'; } else { Auth.clear(); } }
  }
  await sp;
  if (next === 'offline') { $('view').innerHTML = '<div class="splash" style="min-height:60vh">' + logoImg(110) + '<h2>Sem ligação</h2><p class="muted">Não foi possível abrir a tua conta. Verifica a ligação e tenta novamente.</p><button type="button" class="btn btn-primary" onclick="location.reload()">TENTAR NOVAMENTE</button></div>'; return; }
  go(next); if (next === 'home') { pullActivities().then(function () { return syncPending(); }); }
  setTimeout(function () { loadLeaflet(); }, 2500);
}
init();
})();
</script>
